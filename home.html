<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo | Home</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />
    <link rel="stylesheet" href="styles/style.css" />

    <!-- tailwind | daisy ui -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awsome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="min-h-screen max-w-md bg-[#F4F5F7] mx-auto">
    <!-- Header Section -->
    <header class="border-b-2 border-gray-300 sticky top-0 z-10 bg-base-200">
      <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
        <div class="left flex gap-1">
          <div class="logo">
            <img class="w-[60px]" src="/assets/logo.png" alt="" />
          </div>
          <div class="balance-info">
            <h2 class="text-2xl font-bold">
              $ <span id="balance">50000</span>
            </h2>
            <p class="text-neutral/50">Available Bnlance</p>
          </div>
        </div>

        <div class="right rounded-xl overflow-hidden border border-gray-300">
          <a class="btn btn-soft text-gray-500" href="/index.html"
            ><i class="fa-solid fa-right-from-bracket"></i> Logout</a
          >
        </div>
      </section>
    </header>

    <section class="w-11/12 mx-auto py-10 space-y-5">
      <h1 class="text-3xl font-bold">
        Welcome to Pay<span class="text-primary">oo</span>
      </h1>
      <p class="text-neutral/50">
        Enjoy easy and convenient financial services with us. Cashout charge is
        low and
      </p>

      <div class="buttons grid grid-cols-3 gap-3">
        <button
          onclick="showOnly('add-money')"
          class="btn h-full flex-col py-4 btn-primary btn-soft"
        >
          <img src="./assets/opt-1.png" alt="" />
          <p>Add Money</p>
        </button>
        <button
          onclick="showOnly('cashout')"
          class="btn h-full flex-col py-4 btn-primary btn-soft"
        >
          <img src="./assets/opt-2.png" alt="" />
          <p>Cashout</p>
        </button>
        <button
          onclick="showOnly('send-money')"
          class="btn h-full flex-col py-4 btn-primary btn-soft"
        >
          <img src="./assets/opt-3.png" alt="" />
          <p>Send Money</p>
        </button>
        <button
          onclick="showOnly('get-bonus')"
          class="btn h-full flex-col py-4 btn-primary btn-soft"
        >
          <img src="./assets/opt-4.png" alt="" />
          <p>Get Bonus</p>
        </button>
        <button
          onclick="showOnly('pay-bill')"
          class="btn h-full flex-col py-4 btn-primary btn-soft"
        >
          <img src="./assets/opt-5.png" alt="" />
          <p>Pay Bill</p>
        </button>
        <button
          onclick="showOnly('transaction')"
          class="btn h-full flex-col py-4 btn-primary btn-soft"
        >
          <img src="./assets/opt-6.png" alt="" />
          <p>Transactions</p>
        </button>
      </div>
    </section>

    <!-- Add Money Section -->
    <section id="add-money" class="w-11/12 mx-auto py-5">
      <h2 class="text-xl font-bold mb-5">Add Money</h2>

      <div class="card bg-base-100 w-full shadow rounded-2xl">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold">Select A Bank</label>
            <select
              id="add-money-bank"
              class="select w-full bg-base-200 rounded-full"
            >
              <option disabled selected>Select Bank</option>
              <option value="City Bank">City Bank</option>
              <option value="Dhaka Bank">Dhaka Bank</option>
              <option value="Islami Bank">Islami Bank</option>
            </select>
            <br />

            <label class="label text-neutral font-bold"
              >Bank Account Number</label
            >
            <input
              id="add-money-number"
              type="text"
              maxlength="11"
              minlength="11"
              class="w-full input rounded-full bg-[#F4F5F7]"
              placeholder="Enter 11 add money number"
            />
            <br />
            <label class="label text-neutral font-bold">Amount to Add</label>
            <input
              id="add-money-amount"
              type="number"
              class="w-full input rounded-full bg-[#F4F5F7]"
              placeholder="Add amount to withdraw"
            />
            <br />
            <label class="label text-neutral font-bold">Pin Number</label>
            <input
              id="add-money-pin"
              maxlength="4"
              type="password"
              class="w-full input rounded-full bg-[#F4F5F7]"
              placeholder="Enter 4 Digit Pin number"
            />
            <button
              id="add-money-btn"
              class="btn btn-primary mt-4 rounded-full"
            >
              Add Money
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <!-- Cashout Section -->
    <section id="cashout" class="w-11/12 mx-auto py-5">
      <h2 class="text-xl font-bold mb-5">Cashout</h2>

      <div class="card bg-base-100 w-full shadow rounded-2xl">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold">Agent Number</label>
            <input
              id="cashout-number"
              type="text"
              maxlength="11"
              minlength="11"
              class="w-full input rounded-full bg-[#F4F5F7]"
              value="01859346872"
              placeholder="Enter 11 digit number"
            />
            <br />
            <label class="label text-neutral font-bold">Amount</label>
            <input
              id="cashout-amount"
              type="number"
              class="w-full input rounded-full bg-[#F4F5F7]"
              placeholder="Enter amount to withdraw"
            />
            <br />
            <label class="label text-neutral font-bold">Pin Number</label>
            <input
              id="cashout-pin"
              maxlength="4"
              type="password"
              class="w-full input rounded-full bg-[#F4F5F7]"
              placeholder="Enter 4 Digit Pin number"
            />
            <button id="cashout-btn" class="btn btn-primary mt-4 rounded-full">
              Withdraw Money
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <!-- Transfer Money -->
    <section id="send-money" class="w-11/12 mx-auto py-5">
      <h2 class="text-xl font-bold mb-5">Send Money</h2>

      <div class="card bg-base-100 w-full shadow rounded-2xl">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold"
              >User Account Number</label
            >
            <input
              id="send-money-number"
              type="text"
              maxlength="11"
              minlength="11"
              class="w-full input rounded-full bg-[#F4F5F7]"
              value="01859346872"
              placeholder="Enter 11 digit number"
            />
            <br />
            <label class="label text-neutral font-bold">Amount</label>
            <input
              id="sned-money-amount"
              type="number"
              class="w-full input rounded-full bg-[#F4F5F7]"
              placeholder="Enter amount to withdraw"
            />
            <br />
            <label class="label text-neutral font-bold">Pin Number</label>
            <input
              id="send-money-pin"
              maxlength="4"
              type="password"
              class="w-full input rounded-full bg-[#F4F5F7]"
              placeholder="Enter 4 Digit Pin number"
            />
            <button
              id="send-money-btn"
              class="btn btn-primary mt-4 rounded-full"
            >
              Send Now
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <!-- Get Bonus Section -->
    <section id="get-bonus" class="w-11/12 mx-auto py-5">
      <h2 class="text-xl font-bold mb-5">Get Bonus</h2>

      <div class="card bg-base-100 w-full shadow rounded-2xl">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold">Coupon Number</label>
            <input
              id="get-bonus-coupon"
              type="text"
              class="w-full input rounded-full bg-[#F4F5F7]"
              placeholder="Enter coupon to get 500 bonus"
            />
            <button
              id="get-bonus-btn"
              class="btn btn-primary mt-4 rounded-full"
            >
              Get Bonus
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <!-- Pay Bill Section -->
    <section id="pay-bill" class="w-11/12 mx-auto py-5">
      <h2 class="text-xl font-bold mb-5">Pay Bill</h2>

      <div class="card bg-base-100 w-full shadow rounded-2xl">
        <div class="card-body">
          <fieldset class="fieldset">
            <label class="label text-neutral font-bold">Select A Bank</label>
            <select
              id="pay-bill-bank"
              class="select w-full bg-base-200 rounded-full"
            >
              <option disabled selected>Select Bank</option>
              <option value="City Bank">City Bank</option>
              <option value="Dhaka Bank">Dhaka Bank</option>
              <option value="Islami Bank">Islami Bank</option>
            </select>
            <br />

            <label class="label text-neutral font-bold"
              >Biller Account Number</label
            >
            <input
              id="pay-bill-number"
              type="text"
              maxlength="11"
              minlength="11"
              class="w-full input rounded-full bg-[#F4F5F7]"
              placeholder="Enter account number"
            />
            <br />
            <label class="label text-neutral font-bold">Amount to Pay</label>
            <input
              id="pay-bill-amount"
              type="number"
              class="w-full input rounded-full bg-[#F4F5F7]"
              placeholder="Add amount to pay"
            />
            <br />
            <label class="label text-neutral font-bold">Pin Number</label>
            <input
              id="pay-bill-pin"
              maxlength="4"
              type="password"
              class="w-full input rounded-full bg-[#F4F5F7]"
              placeholder="Enter 4 Digit Pin number"
            />
            <button id="pay-bill-btn" class="btn btn-primary mt-4 rounded-full">
              Pay Bill
            </button>
          </fieldset>
        </div>
      </div>
    </section>

    <!-- Transaction -->
    <section id="transaction" class="w-11/12 mx-auto py-5">
      <h2 class="text-xl font-bold mb-5">Transaction</h2>

      <div id="transaction-conatiner" class="space-y-5"></div>
    </section>

    <script src="script/machine.js"></script>
    <script src="script/add-money.js"></script>
    <script src="script/cashout.js"></script>
    <script src="script/send-money.js"></script>
    <script src="script/get-bonus.js"></script>
    <script src="script/pay-bill.js"></script>
  </body>
</html>
